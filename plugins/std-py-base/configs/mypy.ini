; Заготовка mypy для правил std-py-base.
;
; Правило модуля говорит: «аннотации проверяются mypy --strict, аннотация
; без проверки — это комментарий». Здесь строгий режим разложен по флагам,
; чтобы было видно, что именно проверяется и что можно временно ослабить
; на легаси — не выключая проверку целиком.
;
;   pip install mypy
;   mypy .
[mypy]
python_version = 3.12
strict = True

; Составляющие strict, перечисленные явно: на существующем проекте их
; включают по одному, а не откладывают проверку до «когда-нибудь».
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_any_generics = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
strict_equality = True

; Отчёт должен быть читаемым, иначе его перестают открывать
show_error_codes = True
pretty = True

; Сторонние пакеты без аннотаций не должны валить свой код: ошибка чужой
; библиотеки чинится не здесь. Но список исключений явный — общее
; ignore_missing_imports = True прячет и собственные опечатки в импортах.
[mypy-tests.*]
disallow_untyped_defs = False
