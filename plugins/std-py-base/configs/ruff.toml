# Заготовка Ruff для правил std-py-base.
#
# Копируется в корень проекта (или переносится в [tool.ruff] pyproject.toml).
# Набор подобран под правила модуля: выбраны те проверки, за которыми стоит
# записанное правило, а не «всё, что умеет линтер».
#
#   pip install ruff
#   ruff check .
target-version = "py312"
line-length = 100

[lint]
select = [
    "E", "W",     # PEP 8
    "F",          # неиспользуемое, необъявленное
    "I",          # порядок импортов
    "B",          # ловушки: изменяемое значение по умолчанию, тихие except
    "C4",         # генераторы вместо промежуточных списков
    "DTZ",        # 30-language: время только с зоной
    "T20",        # 20-structure: print вместо logging
    "TID252",     # 20-structure: импорты абсолютные
    "PTH",        # 10-language: пути через pathlib
    "SIM",        # упрощения, снижающие вложенность
    "RET",        # возвраты без лишних else
    "ARG",        # неиспользуемые аргументы — обычно забытый рефакторинг
    "ASYNC",      # 30-concurrency: блокирующие вызовы внутри async
    "S",          # безопасность (bandit): eval, subprocess, слабые хеши
    "RUF",
]
ignore = [
    "S101",       # assert в тестах — норма
]

[lint.per-file-ignores]
# Тестам можно то, чего нельзя рабочему коду: фикстуры с неиспользуемыми
# аргументами, длинные строки данных, print при отладке падения.
"tests/**" = ["ARG", "S", "T20"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[format]
quote-style = "double"
