[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
# Возврат Any из типизированной функции — дыра, через которую утекает вся
# польза типизации: дальше по коду проверок уже не будет.
warn_return_any = True
disallow_untyped_defs = True
plugins = pydantic.mypy

[mypy-tests.*]
disallow_untyped_defs = False
