# mutmut — мутационное тестирование для Python.
#   pip install mutmut
#   mutmut run
#   mutmut results          список выживших
#   mutmut show <id>        конкретная мутация
#
# Порог задаётся не самим mutmut, а обвязкой в CI: mutmut умеет отдавать
# статистику в junit-формате, гейт считается по ней.
[mutmut]
paths_to_mutate = src/,app/
tests_dir = tests/
runner = python -m pytest -x -q
# Исключаем то, где мутация не меняет наблюдаемого поведения
also_copy = pyproject.toml,setup.cfg
dict_synonyms = Struct,NamedStruct
