name: Ошибка
description: Замок, скрипт или правило ведут себя не так, как написано в документации
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Если замок можно обойти — это не обычная ошибка. Заведите
        [приватный отчёт о безопасности](https://github.com/DanielLetto2020/vibe-rules/security/advisories/new),
        порядок описан в [SECURITY.md](https://github.com/DanielLetto2020/vibe-rules/blob/main/SECURITY.md).

  - type: dropdown
    id: area
    attributes:
      label: Что сломалось
      options:
        - Замок (guard-bash, guard-tests, guard-infra, guard-deps, guard-commit, guard-secrets, secret-scan)
        - Автоопределение стека (std-link.sh --auto)
        - Строй проверок (gauntlet.sh, гейты, планка мутаций, долг, покрытие)
        - Правило не загружается — или загружается, когда не должно
        - Процедура или команда
        - Тесты или CI
        - Документация
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидалось и что вышло
      description: Что должно было произойти и что произошло вместо этого.
      placeholder: |
        Ожидалось: `podman ps` проходит, блокируется только удаление.
        Вышло: `podman ps` тоже блокируется.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Как воспроизвести
      description: |
        Замки — чистые функции: JSON на входе, решение на выходе. Значит
        воспроизводятся без запуска модели:

        ```bash
        jq -n '{tool_name:"Bash",tool_input:{command:"podman ps"}}' \
          | plugins/std-core/scripts/guard-bash.sh
        ```

        Если дело в автоопределении стека — перечислите файлы, которые есть
        в проекте (`composer.json`, `package.json`, compose-файлы), и какие
        модули слинкованы.
      render: shell
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Окружение
      value: |
        - ОС:
        - Версия Claude Code (`claude --version`):
        - Версия jq:
        - Как установлено (маркетплейс / локальный каталог / клон):
    validations:
      required: true

  - type: checkboxes
    id: tests
    attributes:
      label: Прогон тестов
      options:
        - label: Запускал `tests/run.sh` — ошибка воспроизводится и там
        - label: Запускал `tests/run.sh` — он зелёный, проблема только на живом проекте
