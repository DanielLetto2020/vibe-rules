# Изолированное окружение для работы агента.
#
# Замки ловят обычную ошибку. Границу ущерба задаёт окружение — этот файл
# и есть та граница. Подробности решения: docs/THREAT-MODEL.md
#
#   podman compose -f templates/devcontainer/compose.yml run --rm agent
#   docker compose -f templates/devcontainer/compose.yml run --rm agent
#
# Локально в этом проекте — podman.

services:
  agent:
    build:
      context: .
      dockerfile: Containerfile
      args:
        # Совпадение с хостовым пользователем: иначе файлы, созданные внутри,
        # окажутся чужими снаружи, и первым делом их начнут чинить через chown.
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    # От непривилегированного пользователя. Root внутри контейнера — это root
    # на смонтированных каталогах.
    user: "${UID:-1000}:${GID:-1000}"

    working_dir: /work

    volumes:
      # Единственное, что доступно на запись, — сам проект.
      - ../..:/work:z
      # Настройки Claude Code — только на чтение: изнутри их менять незачем,
      # а правка хуков отсюда отключила бы проверки.
      - ${HOME}/.claude/plugins:/home/dev/.claude/plugins:ro,z

    # Сокет контейнерного движка НЕ пробрасывается. С ним изнутри поднимается
    # привилегированный контейнер с монтированием хоста — то есть изоляции нет.
    # Если агенту нужны контейнеры, поднимайте их снаружи и давайте адрес.

    environment:
      - TERM=xterm-256color
      - LC_ALL=C.UTF-8
      # Ключей здесь быть не должно. Нужен доступ к приватному репозиторию —
      # выдайте токен с правами только на чтение и только на время задачи.

    # Ограничения ресурсов: бесконечный цикл в сгенерированном коде не должен
    # укладывать машину целиком.
    mem_limit: 4g
    pids_limit: 512

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Сеть нужна пакетным репозиториям и документации, поэтому по умолчанию
    # включена. Для недоверенной работы: раскомментируйте и поставьте
    # зависимости заранее, на этапе сборки образа.
    # network_mode: none

    tty: true
    stdin_open: true
    command: ["bash"]
